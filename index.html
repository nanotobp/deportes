<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Deportes Paraguay Live</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    :root {
      --bg: #ffffff;
      --bg-soft: #f5f5f7;
      --card-bg: #ffffff;
      --border-subtle: #e5e5ea;
      --text-main: #111111;
      --text-muted: #6e6e73;
      --accent: #0071e3;
      --accent-soft: #e9f2ff;
      --danger: #ff3b30;
      --success: #34c759;
      --card-radius: 18px;
      --shadow-soft: 0 8px 24px rgba(0, 0, 0, 0.06);
      --max-width: 1120px;
      --transition-fast: 0.18s ease-out;
    }
    /* modo oscuro */
    .dark-theme {
      --bg: #050509;
      --bg-soft: #111118;
      --card-bg: #15151f;
      --border-subtle: #272736;
      --text-main: #f5f5f7;
      --text-muted: #a1a1b2;
      --accent: #0a84ff;
      --accent-soft: #10253d;
      --shadow-soft: 0 8px 24px rgba(0, 0, 0, 0.7);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text",
        "SF Pro Display", "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #f5f5f7 0, var(--bg) 42%);
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
    }

    .app-shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-subtle);
    }
    .dark-theme header {
      background: rgba(10, 10, 15, 0.92);
    }

    .header-inner {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 26px;
      height: 26px;
      border-radius: 9px;
      background: linear-gradient(135deg, #ff3b30, #ff9500);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 700;
      font-size: 14px;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand-sub {
      font-size: 11px;
      color: var(--text-muted);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    nav {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }

    .nav-pill {
      font-size: 12px;
      padding: 6px 11px;
      border-radius: 999px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: background var(--transition-fast),
        color var(--transition-fast),
        border-color var(--transition-fast),
        transform var(--transition-fast);
      white-space: nowrap;
    }

    .nav-pill.active {
      background: var(--bg-soft);
      border-color: var(--border-subtle);
      color: var(--text-main);
      font-weight: 600;
    }

    .nav-pill:hover {
      border-color: var(--border-subtle);
      background: #f0f0f3;
      transform: translateY(-1px);
    }

    .dark-theme .nav-pill:hover {
      background: #1c1c28;
    }

    .theme-toggle {
      border-radius: 999px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-soft);
      padding: 6px 10px;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      color: var(--text-main);
      transition: background var(--transition-fast),
        border-color var(--transition-fast),
        transform var(--transition-fast);
    }
    .theme-toggle:hover {
      background: var(--card-bg);
      transform: translateY(-1px);
    }

    main {
      flex: 1;
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 16px 16px 28px;
    }

    .view {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .section-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .section-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .section-subtitle {
      font-size: 12px;
      color: var(--text-muted);
    }

    .section-link {
      font-size: 12px;
      color: var(--accent);
      text-decoration: none;
      cursor: pointer;
    }
    .section-link:hover { text-decoration: underline; }

    .hero-card {
      border-radius: 24px;
      background: var(--card-bg);
      box-shadow: var(--shadow-soft);
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      overflow: hidden;
      min-height: 220px;
    }
    @media (max-width: 768px) {
      .hero-card { grid-template-columns: 1fr; }
    }

    .hero-image {
      background: radial-gradient(circle at top, #ff9f0a, #ff375f);
      position: relative;
    }
    .dark-theme .hero-image {
      background: radial-gradient(circle at top, #ff9f0a, #8e24aa);
    }

    .hero-image::after {
      content: "";
      position: absolute;
      inset: 18px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.24);
      opacity: 0.7;
    }

    .hero-label {
      position: absolute;
      top: 16px;
      left: 16px;
      padding: 4px 10px;
      font-size: 11px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.38);
      color: #fff;
      backdrop-filter: blur(10px);
    }

    .hero-score {
      position: absolute;
      left: 20px;
      right: 20px;
      bottom: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #fff;
    }

    .hero-team {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .hero-team-name {
      font-size: 18px;
      font-weight: 700;
    }

    .hero-team-meta {
      font-size: 12px;
      opacity: 0.85;
    }

    .hero-score-number {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    .hero-body {
      padding: 16px 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .hero-chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 11px;
    }

    .chip {
      border-radius: 999px;
      padding: 3px 9px;
      background: var(--bg-soft);
      color: var(--text-muted);
      border: 1px solid rgba(0,0,0,0.03);
    }

    .hero-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .hero-meta {
      font-size: 12px;
      color: var(--text-muted);
    }

    .hero-cta-row {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn-primary {
      padding: 7px 14px;
      border-radius: 999px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background var(--transition-fast),
        transform var(--transition-fast),
        box-shadow var(--transition-fast);
    }
    .btn-primary:hover {
      background: #0059b8;
      box-shadow: 0 6px 16px rgba(0, 113, 227, 0.35);
      transform: translateY(-1px);
    }

    .btn-soft {
      padding: 7px 14px;
      border-radius: 999px;
      border: 1px solid var(--border-subtle);
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 13px;
      cursor: pointer;
      transition: background var(--transition-fast),
        border-color var(--transition-fast),
        transform var(--transition-fast);
    }
    .btn-soft:hover {
      background: var(--bg-soft);
      transform: translateY(-1px);
    }

    .matches-list, .results-list, .news-grid, .teams-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 10px;
    }

    .match-card, .result-card, .news-card, .team-card {
      border-radius: var(--card-radius);
      border: 1px solid var(--border-subtle);
      background: var(--card-bg);
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: box-shadow var(--transition-fast),
        transform var(--transition-fast),
        border-color var(--transition-fast),
        background var(--transition-fast);
    }

    .news-card, .team-card {
      padding: 0;
      overflow: hidden;
    }

    .match-card:hover, .result-card:hover,
    .news-card:hover, .team-card:hover {
      box-shadow: var(--shadow-soft);
      transform: translateY(-2px);
      border-color: rgba(0,0,0,0.08);
    }

    .match-league, .match-footer, .result-top {
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      gap: 4px;
    }

    .match-main-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .match-team-col {
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-size: 13px;
    }

    .match-team-name {
      font-weight: 600;
    }

    .match-team-meta {
      font-size: 11px;
      color: var(--text-muted);
    }

    .team-badge {
      width: 22px;
      height: 22px;
      border-radius: 999px;
      object-fit: contain;
      background: #fff;
      border: 1px solid rgba(0,0,0,0.04);
    }

    .match-score {
      min-width: 74px;
      text-align: center;
    }

    .match-score-line {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .match-status {
      font-size: 11px;
      font-weight: 600;
      color: var(--success);
    }
    .match-status.pending {
      color: var(--text-muted);
      font-weight: 500;
    }
    .match-status.finished {
      color: var(--text-muted);
    }

    .live-pill {
      font-size: 10px;
      color: #fff;
      background: var(--danger);
      padding: 2px 6px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-left: 4px;
    }

    .results-list .result-card {
      padding: 8px 10px;
      gap: 4px;
    }

    .result-teams {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 600;
    }
    .result-score {
      font-size: 16px;
      font-weight: 700;
    }

    .standings-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: thin;
      scrollbar-color: var(--border-subtle) transparent;
    }
    .standings-strip::-webkit-scrollbar { height: 6px; }
    .standings-strip::-webkit-scrollbar-thumb {
      background: var(--border-subtle);
      border-radius: 999px;
    }

    .team-chip {
      min-width: 90px;
      padding: 8px 10px;
      border-radius: 14px;
      background: var(--bg-soft);
      border: 1px solid rgba(0,0,0,0.04);
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-size: 11px;
    }

    .team-chip-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 4px;
    }

    .team-chip-pos {
      font-weight: 700;
      font-size: 11px;
    }

    .team-chip-name {
      font-weight: 600;
      font-size: 11px;
    }

    .team-chip-points {
      font-size: 13px;
      font-weight: 700;
    }

    .team-chip-form {
      display: flex;
      gap: 2px;
      margin-top: 2px;
    }
    .form-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: #d2d2d7;
    }
    .form-dot.win { background: #34c759; }
    .form-dot.draw { background: #ffcc00; }
    .form-dot.loss { background: #ff3b30; }

    .news-thumb {
      height: 110px;
      background: linear-gradient(135deg, #0a84ff, #30d158);
    }
    .dark-theme .news-thumb {
      background: linear-gradient(135deg, #0a84ff, #8e24aa);
    }

    .news-body {
      padding: 10px 12px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .news-tag {
      font-size: 11px;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 600;
    }
    .news-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .news-meta {
      font-size: 11px;
      color: var(--text-muted);
    }

    .team-card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px 8px;
    }
    .team-card-body {
      padding: 0 12px 10px;
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .team-name {
      font-size: 14px;
      font-weight: 700;
    }

    .badge-lg {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      object-fit: contain;
      background: #fff;
      border: 1px solid rgba(0,0,0,0.04);
    }

    .team-detail {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(0, 1.4fr);
      gap: 16px;
    }
    @media (max-width: 860px) {
      .team-detail { grid-template-columns: 1fr; }
    }

    .team-detail-card {
      border-radius: 20px;
      background: var(--card-bg);
      border: 1px solid var(--border-subtle);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    th, td {
      padding: 6px 4px;
      text-align: left;
    }
    th {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-subtle);
    }
    tr:nth-child(even) td {
      background: rgba(0,0,0,0.01);
    }
    .dark-theme tr:nth-child(even) td {
      background: #101018;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 10px;
      border: 1px solid var(--border-subtle);
      background: var(--accent-soft);
      color: var(--accent);
    }

    .hint {
      font-size: 11px;
      color: var(--text-muted);
    }

    footer {
      border-top: 1px solid var(--border-subtle);
      font-size: 11px;
      color: var(--text-muted);
      padding: 12px 16px 18px;
    }

    .footer-inner {
      max-width: var(--max-width);
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header>
      <div class="header-inner">
        <div class="brand">
          <div class="brand-icon">PY</div>
          <div class="brand-text">
            <div class="brand-title">Deportes Paraguay</div>
            <div class="brand-sub">Fútbol paraguayo, sin ruido.</div>
          </div>
        </div>
        <div class="header-right">
          <nav>
            <button class="nav-pill active" data-route="home">Inicio</button>
            <button class="nav-pill" data-route="partidos">Partidos</button>
            <button class="nav-pill" data-route="tabla">Tabla</button>
            <button class="nav-pill" data-route="equipos">Equipos</button>
          </nav>
          <button class="theme-toggle" id="themeToggle">
            <span id="themeIcon">☾</span>
            <span class="theme-label">Oscuro</span>
          </button>
        </div>
      </div>
    </header>

    <main>
      <div id="app" class="view">
        <!-- acá el JS inyecta las vistas -->
      </div>
    </main>

    <footer>
      <div class="footer-inner">
        <span>© 2025 Deportes Paraguay · Demo · Datos TheSportsDB + Noticias externas</span>
        <span>Hecho en Paraguay, conectado a APIs ⚽</span>
      </div>
    </footer>
  </div>

  <script>
    // ================= CONFIG =====================
    const LEAGUE_ID = 4347;            // Primera División PY
    const SEASON   = "2024-2025";      // actualizar según torneo

    // Noticias: NewsData.io o similar
    // REGISTRATE y poné tu API KEY acá:
    const NEWS_API_KEY = "PON_ACÁ_TU_API_KEY"; // p.ej. de newsdata.io
    const NEWS_URL = NEWS_API_KEY
      ? `https://newsdata.io/api/1/news?apikey=${NEWS_API_KEY}&country=py&language=es&category=sports`
      : null;

    // Estado global simple
    const state = {
      nextMatches: [],
      pastMatches: [],
      table: [],
      teams: [],
      teamById: {},
      teamBadgeById: {},
      news: [],
      lastUpdated: null
    };

    const appEl = document.getElementById("app");

    // ================ UTILS ===================

    function createEl(html) {
      const t = document.createElement("template");
      t.innerHTML = html.trim();
      return t.content.firstChild;
    }

    function formatHour(timeStr) {
      if (!timeStr) return "";
      return timeStr.slice(0,5);
    }

    function todayISO() {
      const d = new Date();
      return d.toISOString().slice(0,10);
    }

    function isToday(dateStr) {
      return dateStr === todayISO();
    }

    function liveStatus(match) {
      // pseudo "live": si tiene score y es hoy, lo consideramos en juego / recién terminado
      if (match.intHomeScore != null && isToday(match.dateEventLocal || match.dateEvent)) {
        return "live";
      }
      if (match.intHomeScore != null) return "finished";
      return "upcoming";
    }

    // =============== API CALLS ==================

    async function fetchJSON(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error("Error HTTP " + res.status);
      return res.json();
    }

    async function loadData() {
      const [next, past, table, teams] = await Promise.all([
        fetchJSON(`https://api.allorigins.win/raw?url=https://www.thesportsdb.com/api/v1/json/3/eventsnextleague.php?id=${LEAGUE_ID}`),
        fetchJSON(`https://api.allorigins.win/raw?url=https://www.thesportsdb.com/api/v1/json/3/eventspastleague.php?id=${LEAGUE_ID}`),
        fetchJSON(`https://api.allorigins.win/raw?url=https://www.thesportsdb.com/api/v1/json/3/lookuptable.php?l=${LEAGUE_ID}&s=${SEASON}`),
        fetchJSON(`https://api.allorigins.win/raw?url=https://www.thesportsdb.com/api/v1/json/3/lookup_all_teams.php?id=${LEAGUE_ID}`)
      ]);

      state.nextMatches = next.events || [];
      state.pastMatches = past.events || [];
      state.table = table.table || [];
      state.teams = teams.teams || [];
      state.teamById = {};
      state.teamBadgeById = {};
      state.teams.forEach(t => {
        state.teamById[t.idTeam] = t;
        state.teamBadgeById[t.idTeam] = t.strTeamBadge;
      });

      state.lastUpdated = new Date();

      if (NEWS_URL && !state.news.length) {
        try {
          const newsRes = await fetchJSON(NEWS_URL);
          state.news = newsRes.results || newsRes.articles || [];
        } catch (e) {
          console.warn("Error cargando noticias:", e);
        }
      }

      console.log("Datos cargados", state);
    }

    // =============== RENDER HELPERS ===============

    function renderHero() {
      const all = [...state.nextMatches, ...state.pastMatches];
      if (!all.length) return "";

      // Priorizar en vivo, luego próximos, luego último jugado
      let heroMatch =
        all.find(m => liveStatus(m) === "live") ||
        state.nextMatches[0] ||
        state.pastMatches[0];

      const status = liveStatus(heroMatch);
      let label = "";
      if (status === "live") label = "En vivo";
      else if (status === "finished") label = "Final";
      else label = formatHour(heroMatch.strTimeLocal || heroMatch.strTime);

      const hTeam = heroMatch.strHomeTeam;
      const aTeam = heroMatch.strAwayTeam;
      const league = heroMatch.strLeague || "Liga Paraguaya";

      const title = status === "live"
        ? `${hTeam} vs ${aTeam}: se juega ahora mismo`
        : `${hTeam} vs ${aTeam}: próximo partido destacado`;

      const meta = [
        league,
        heroMatch.dateEventLocal || heroMatch.dateEvent || "",
        heroMatch.strVenue || ""
      ].filter(Boolean).join(" · ");

      const scoreStr = heroMatch.intHomeScore != null
        ? `${heroMatch.intHomeScore} – ${heroMatch.intAwayScore}`
        : "– : –";

      return `
        <section class="section">
          <div class="section-header">
            <div>
              <div class="section-title">Partido destacado</div>
              <div class="section-subtitle">${league}</div>
            </div>
            <button class="section-link" data-route="partidos">Ver calendario</button>
          </div>

          <article class="hero-card" data-match-id="${heroMatch.idEvent || ""}">
            <div class="hero-image">
              <div class="hero-label">
                ${label}
                ${status === "live" ? '<span class="live-pill">LIVE</span>' : ""}
              </div>
              <div class="hero-score">
                <div class="hero-team">
                  <div class="hero-team-name">${hTeam}</div>
                  <div class="hero-team-meta">Local</div>
                </div>
                <div class="hero-score-number">${scoreStr}</div>
                <div class="hero-team" style="text-align:right">
                  <div class="hero-team-name">${aTeam}</div>
                  <div class="hero-team-meta">Visitante</div>
                </div>
              </div>
            </div>
            <div class="hero-body">
              <div class="hero-chip-row">
                <span class="chip">${league}</span>
                <span class="chip">${status === "live" ? "Actualizado en tiempo real" : "Próximo partido"}</span>
                <span class="chip">${heroMatch.strVenue || "Estadio por confirmar"}</span>
              </div>
              <h1 class="hero-title">${title}</h1>
              <p class="hero-meta">
                ${meta}
              </p>
              <div class="hero-cta-row">
                <button class="btn-primary" data-route="partidos">
                  Ver todos los partidos de hoy
                </button>
                <button class="btn-soft" data-route="tabla">
                  Ver tabla de posiciones
                </button>
              </div>
            </div>
          </article>
        </section>
      `;
    }

    function renderMatchCard(m) {
      const status = liveStatus(m);
      let statusLabel = "";
      let statusClass = "";
      if (status === "live") {
        statusLabel = "En vivo";
        statusClass = "";
      } else if (status === "finished") {
        statusLabel = "Finalizado";
        statusClass = "finished";
      } else {
        statusLabel = "Próximo";
        statusClass = "pending";
      }

      const homeBadge = state.teamBadgeById[m.idHomeTeam];
      const awayBadge = state.teamBadgeById[m.idAwayTeam];

      const scoreStr = m.intHomeScore != null
        ? `${m.intHomeScore} – ${m.intAwayScore}`
        : "– : –";

      return `
        <article class="match-card" data-match-id="${m.idEvent || ""}">
          <div class="match-league">
            <span>${m.strLeague || "Liga Paraguaya"}</span>
            <span>${m.dateEventLocal || m.dateEvent || ""} · ${formatHour(m.strTimeLocal || m.strTime)}</span>
          </div>
          <div class="match-main-row">
            <div class="match-team-col">
              <div style="display:flex;align-items:center;gap:6px;">
                ${homeBadge ? `<img src="${homeBadge}" alt="${m.strHomeTeam}" class="team-badge" />` : ""}
                <span class="match-team-name">${m.strHomeTeam}</span>
              </div>
              <span class="match-team-meta">Local</span>
            </div>
            <div class="match-score">
              <div class="match-score-line">${scoreStr}</div>
              <div class="match-status ${statusClass}">
                ${statusLabel}
                ${status === "live" ? '<span class="live-pill">LIVE</span>' : ""}
              </div>
            </div>
            <div class="match-team-col" style="text-align:right">
              <div style="display:flex;align-items:center;gap:6px;justify-content:flex-end;">
                <span class="match-team-name">${m.strAwayTeam}</span>
                ${awayBadge ? `<img src="${awayBadge}" alt="${m.strAwayTeam}" class="team-badge" />` : ""}
              </div>
              <span class="match-team-meta">Visitante</span>
            </div>
          </div>
          <div class="match-footer">
            <span>${m.strVenue || ""}</span>
            <span>${m.strTVStation || ""}</span>
          </div>
        </article>
      `;
    }

    function renderResultsCards(list) {
      return list.slice(0, 6).map(m => `
        <article class="result-card">
          <div class="result-top">
            <span>${m.strLeague}</span>
            <span>${m.dateEventLocal || m.dateEvent || ""}</span>
          </div>
          <div class="result-teams">
            <span>${m.strHomeTeam}</span>
            <span class="result-score">${m.intHomeScore} – ${m.intAwayScore}</span>
            <span>${m.strAwayTeam}</span>
          </div>
          <div class="result-top">
            <span>${m.strVenue || ""}</span>
            <span>Detalles</span>
          </div>
        </article>
      `).join("");
    }

    function renderTableStrip() {
      if (!state.table.length) return "";

      const chips = state.table.map(t => `
        <article class="team-chip">
          <div class="team-chip-header">
            <span class="team-chip-pos">${t.intRank}</span>
            <span class="team-chip-name">${t.strTeam}</span>
          </div>
          <span class="team-chip-points">${t.intPoints} pts</span>
          <div class="team-chip-form">
            <span class="form-dot ${t.strForm?.includes("W") ? "win" : "loss"}"></span>
            <span class="form-dot ${t.strForm?.includes("D") ? "draw" : "loss"}"></span>
            <span class="form-dot loss"></span>
          </div>
        </article>
      `).join("");

      return `
        <section class="section">
          <div class="section-header">
            <div>
              <div class="section-title">Tabla de posiciones</div>
              <div class="section-subtitle">Primera División · ${SEASON}</div>
            </div>
            <button class="section-link" data-route="tabla">Ver tabla completa</button>
          </div>
          <div class="standings-strip">
            ${chips}
          </div>
        </section>
      `;
    }

    function renderNewsSection() {
      if (!state.news.length) {
        return `
          <section class="section">
            <div class="section-header">
              <div>
                <div class="section-title">Noticias destacadas</div>
                <div class="section-subtitle">
                  Conectá una API de noticias para ver titulares reales.
                </div>
              </div>
            </div>
            <p class="hint">
              Editá <code>NEWS_API_KEY</code> en el script para usar NewsData.io, NewsAPI.org u otra
              fuente y mostrar noticias deportivas de Paraguay.
            </p>
          </section>
        `;
      }

      const cards = state.news.slice(0, 6).map(n => `
        <article class="news-card">
          <div class="news-thumb" style="${n.image_url ? `background-image:url('${n.image_url}');background-size:cover;background-position:center;` : ""}"></div>
          <div class="news-body">
            <div class="news-tag">Noticias</div>
            <div class="news-title">${n.title || "Titular"}</div>
            <div class="news-meta">
              ${(n.source_id || n.source || "").toUpperCase()} · ${n.pubDate || n.published_at || ""}
            </div>
          </div>
        </article>
      `).join("");

      return `
        <section class="section">
          <div class="section-header">
            <div>
              <div class="section-title">Noticias reales</div>
              <div class="section-subtitle">
                Últimos titulares deportivos desde medios paraguayos.
              </div>
            </div>
          </div>
          <div class="news-grid">
            ${cards}
          </div>
        </section>
      `;
    }

    // =============== VISTAS / RUTAS =================

    function viewHome() {
      const liveOrSoon = state.nextMatches.slice(0, 6);
      const last = state.pastMatches.slice(0, 6);

      appEl.innerHTML = `
        ${renderHero()}
        <section class="section">
          <div class="section-header">
            <div>
              <div class="section-title">Partidos de hoy y próximos</div>
              <div class="section-subtitle">Agenda cercana de la liga paraguaya.</div>
            </div>
            <button class="section-link" data-route="partidos">Ver todos los partidos</button>
          </div>
          <div class="matches-list">
            ${liveOrSoon.map(renderMatchCard).join("")}
          </div>
        </section>
        <section class="section">
          <div class="section-header">
            <div>
              <div class="section-title">Últimos resultados</div>
              <div class="section-subtitle">Lo último del fútbol paraguayo.</div>
            </div>
            <button class="section-link" data-route="partidos">Ver más resultados</button>
          </div>
          <div class="results-list">
            ${renderResultsCards(last)}
          </div>
        </section>
        ${renderTableStrip()}
        ${renderNewsSection()}
      `;
    }

    function viewPartidos() {
      const all = [...state.nextMatches, ...state.pastMatches];
      // ordenar por fecha y hora
      all.sort((a, b) => {
        const da = (a.dateEventLocal || a.dateEvent || "") + (a.strTimeLocal || a.strTime || "");
        const db = (b.dateEventLocal || b.dateEvent || "") + (b.strTimeLocal || b.strTime || "");
        return da.localeCompare(db);
      });

      appEl.innerHTML = `
        <section class="section">
          <div class="section-header">
            <div>
              <div class="section-title">Todos los partidos</div>
              <div class="section-subtitle">
                Próximos, en juego y recientes. Actualiza cada 30 segundos.
              </div>
            </div>
          </div>
          <div class="matches-list">
            ${all.map(renderMatchCard).join("")}
          </div>
          <p class="hint">
            Tip: podés usar estos datos para generar contenido automatizado en redes (previas, resultados, estadísticas).
          </p>
        </section>
      `;
    }

    function viewTabla() {
      const rows = state.table;

      appEl.innerHTML = `
        <section class="section">
          <div class="section-header">
            <div>
              <div class="section-title">Tabla completa</div>
              <div class="section-subtitle">Primera División · ${SEASON}</div>
            </div>
          </div>
          <section class="section">
            <div class="standings-strip">
              ${rows.map(t => `
                <article class="team-chip">
                  <div class="team-chip-header">
                    <span class="team-chip-pos">${t.intRank}</span>
                    <span class="team-chip-name">${t.strTeam}</span>
                  </div>
                  <span class="team-chip-points">${t.intPoints} pts</span>
                  <div class="team-chip-form">
                    <span class="form-dot ${t.strForm?.includes("W") ? "win" : "loss"}"></span>
                    <span class="form-dot ${t.strForm?.includes("D") ? "draw" : "loss"}"></span>
                    <span class="form-dot loss"></span>
                  </div>
                </article>
              `).join("")}
            </div>
          </section>
          <section class="section">
            <div class="team-detail-card">
              <table>
                <thead>
                  <tr>
                    <th>#</th>
                    <th>Equipo</th>
                    <th>PJ</th>
                    <th>G</th>
                    <th>E</th>
                    <th>P</th>
                    <th>GF</th>
                    <th>GC</th>
                    <th>DG</th>
                    <th>Pts</th>
                  </tr>
                </thead>
                <tbody>
                  ${rows.map(t => `
                    <tr>
                      <td>${t.intRank}</td>
                      <td>${t.strTeam}</td>
                      <td>${t.intPlayed}</td>
                      <td>${t.intWin}</td>
                      <td>${t.intDraw}</td>
                      <td>${t.intLoss}</td>
                      <td>${t.intGoalsFor}</td>
                      <td>${t.intGoalsAgainst}</td>
                      <td>${t.intGoalDifference}</td>
                      <td>${t.intPoints}</td>
                    </tr>
                  `).join("")}
                </tbody>
              </table>
            </div>
            <p class="hint">
              Datos provistos por TheSportsDB (free tier). Podés sumarle tus propios cálculos (promedios, forma, etc.) con tu backend o n8n.
            </p>
          </section>
        </section>
      `;
    }

    function viewEquipos() {
      const cards = state.teams.map(t => `
        <article class="team-card" data-route="equipo" data-team-id="${t.idTeam}">
          <div class="team-card-header">
            <img src="${t.strTeamBadge}" alt="${t.strTeam}" class="badge-lg" />
            <div>
              <div class="team-name">${t.strTeam}</div>
              <div class="section-subtitle">${t.strStadium || ""}</div>
            </div>
          </div>
          <div class="team-card-body">
            <span>Fundado: ${t.intFormedYear || "—"}</span>
            <span>Ciudad: ${t.strStadiumLocation || "—"}</span>
            <span>Sport: ${t.strSport}</span>
          </div>
        </article>
      `).join("");

      appEl.innerHTML = `
        <section class="section">
          <div class="section-header">
            <div>
              <div class="section-title">Equipos</div>
              <div class="section-subtitle">
                Todos los clubes de la Primera División Paraguaya.
              </div>
            </div>
          </div>
          <div class="teams-grid">
            ${cards}
          </div>
        </section>
      `;
    }

    function viewEquipo(idTeam) {
      const t = state.teamById[idTeam];
      if (!t) {
        appEl.innerHTML = `
          <section class="section">
            <div class="section-header">
              <div>
                <div class="section-title">Equipo no encontrado</div>
                <div class="section-subtitle">Revisá el ID o volvé a la lista.</div>
              </div>
            </div>
            <button class="btn-soft" data-route="equipos">Volver a equipos</button>
          </section>
        `;
        return;
      }

      const badge = t.strTeamBadge;
      const desc = (t.strDescriptionES || t.strDescriptionEN || "")
        .split(". ")
        .slice(0, 3)
        .join(". ") || "Descripción no disponible todavía.";

      // últimos partidos del equipo
      const allMatches = [...state.nextMatches, ...state.pastMatches];
      const related = allMatches.filter(m => m.idHomeTeam === idTeam || m.idAwayTeam === idTeam).slice(0, 6);

      appEl.innerHTML = `
        <section class="section">
          <div class="section-header">
            <div>
              <div class="section-title">${t.strTeam}</div>
              <div class="section-subtitle">${t.strLeague || ""}</div>
            </div>
            <button class="section-link" data-route="equipos">← Volver a equipos</button>
          </div>

          <div class="team-detail">
            <div class="team-detail-card">
              <div style="display:flex;align-items:center;gap:14px;">
                <img src="${badge}" alt="${t.strTeam}" class="badge-lg" />
                <div>
                  <div class="team-name">${t.strTeam}</div>
                  <div class="section-subtitle">
                    Fundado: ${t.intFormedYear || "—"} · ${t.strStadium || ""}
                  </div>
                  <div class="section-subtitle">
                    Ciudad: ${t.strStadiumLocation || "—"}
                  </div>
                </div>
              </div>
              <p style="font-size:13px;color:var(--text-muted);margin-top:6px;">
                ${desc}
              </p>
            </div>

            <div class="team-detail-card">
              <div class="section-header">
                <div>
                  <div class="section-title" style="font-size:15px;">Partidos recientes</div>
                  <div class="section-subtitle">Hasta 6 partidos vinculados a ${t.strTeam}.</div>
                </div>
              </div>
              <div class="matches-list">
                ${related.length ? related.map(renderMatchCard).join("") : "<p class='hint'>Todavía no hay partidos vinculados en la ventana actual.</p>"}
              </div>
            </div>
          </div>
        </section>
      `;
    }

    // =============== ROUTER ====================

    function setActiveNav(route) {
      document.querySelectorAll(".nav-pill").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.route === route);
      });
    }

    function navigate(hash) {
      const [route, param] = hash.replace("#", "").split("/").filter(Boolean);

      if (!route || route === "home") {
        setActiveNav("home");
        viewHome();
      } else if (route === "partidos") {
        setActiveNav("partidos");
        viewPartidos();
      } else if (route === "tabla") {
        setActiveNav("tabla");
        viewTabla();
      } else if (route === "equipos" && !param) {
        setActiveNav("equipos");
        viewEquipos();
      } else if (route === "equipo" && param) {
        setActiveNav("equipos");
        viewEquipo(param);
      } else {
        setActiveNav("home");
        viewHome();
      }

      attachInternalLinks();
    }

    function attachInternalLinks() {
      // nav pills botón
      document.querySelectorAll("[data-route]").forEach(el => {
        el.onclick = (e) => {
          const r = el.dataset.route;
          const teamId = el.dataset.teamId;
          if (!r) return;
          if (r === "equipo" && teamId) {
            location.hash = `#/equipo/${teamId}`;
          } else {
            location.hash = r === "home" ? "#/" : `#/${r}`;
          }
        };
      });
    }

    window.addEventListener("hashchange", () => navigate(location.hash));

    // =============== THEME =====================

    const themeToggleBtn = document.getElementById("themeToggle");
    const themeIcon = document.getElementById("themeIcon");

    function applyTheme(theme) {
      if (theme === "dark") {
        document.documentElement.classList.add("dark-theme");
        themeIcon.textContent = "☀";
      } else {
        document.documentElement.classList.remove("dark-theme");
        themeIcon.textContent = "☾";
      }
    }

    function initTheme() {
      const stored = localStorage.getItem("dp-theme");
      if (stored) {
        applyTheme(stored);
      } else {
        const prefersDark = window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches;
        applyTheme(prefersDark ? "dark" : "light");
      }
    }

    themeToggleBtn.addEventListener("click", () => {
      const isDark = document.documentElement.classList.contains("dark-theme");
      const newTheme = isDark ? "light" : "dark";
      applyTheme(newTheme);
      localStorage.setItem("dp-theme", newTheme);
    });

    // =============== LIVE REFRESH ==================

    async function refreshDataAndView() {
      try {
        await loadData();
        navigate(location.hash || "#/");
      } catch (e) {
        console.error("Error refrescando datos:", e);
      }
    }

    // =============== INIT =========================

    (async function init() {
      initTheme();
      await refreshDataAndView();
      // "live": refrescar cada 30s
      setInterval(refreshDataAndView, 30000);
    })();
  </script>
</body>
</html>
